name: CI

on:
  pull_request:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned secret scanner
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan Git history
        run: '"$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner .'

  runtime:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: limina
          POSTGRES_PASSWORD: limina
          POSTGRES_DB: limina
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U limina -d limina"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test (SQLite)
        run: cargo test --workspace --locked
      - name: Test (PostgreSQL)
        run: cargo test --workspace --locked -- --test-threads=1
        env:
          LIMINA_TEST_POSTGRES_URL: postgres://limina:limina@127.0.0.1:5432/limina

  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - name: Install locked tooling dependencies
        run: uv sync --locked --dev
      - name: Run tests
        run: LIMINA_TELEMETRY_INTERNAL=1 uv run python -m unittest discover -s tests
      - name: Validate KB
        run: LIMINA_TELEMETRY_INTERNAL=1 uv run python scripts/kb_validate.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked web dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
