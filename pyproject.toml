[project]
name = "limina-template-tooling"
version = "0.2.0"
description = "Validation, scaffolding and telemetry scripts for file-based Limina projects."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[dependency-groups]
dev = [
  "python-frontmatter>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
