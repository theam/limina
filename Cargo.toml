[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/theam/limina"

[workspace.dependencies]
limina-core = { path = "crates/limina-core" }
limina-store = { path = "crates/limina-store" }
limina-domain = { path = "crates/limina-domain" }
limina-engines = { path = "crates/limina-engines" }
limina-server = { path = "crates/limina-server" }

anyhow = "1"
rust_decimal = { version = "1", features = ["std"] }
async-trait = "0.1"
limina-cli = { path = "crates/limina-cli" }
axum = { version = "0.8", features = ["ws", "multipart", "macros"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.6", features = ["derive", "env"] }
fernet = "0.2"
futures = "0.3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "chrono", "json", "macros"] }
thiserror = "2"
tokio = { version = "1.53", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev.package."*"]
opt-level = 1

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"
